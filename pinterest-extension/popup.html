<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pinterest Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 12px;
      font-size: 12px;
    }
    body.theme-light {
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    body.theme-light .header {
      border-bottom-color: #cbd5e1;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 13px;
    }
    .logo-badge {
      width: 22px;
      height: 22px;
      background: #e60023;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 12px;
      color: #ffffff;
    }
    .theme-toggle-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    body.theme-light .theme-toggle-btn {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e293b;
    }
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(2, 132, 199, 0.12);
      border: 1px solid rgba(2, 132, 199, 0.25);
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 11px;
    }
    .queue-btn {
      background: #0284c7;
      border: none;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .queue-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pin-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    body.theme-light .pin-card {
      background: #ffffff;
      border-color: #cbd5e1;
    }
    .pin-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .pin-id-badge {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      font-weight: bold;
      background: rgba(230,0,35,0.15);
      color: #ff4d6d;
      border: 1px solid rgba(230,0,35,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .field-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px 10px;
    }
    body.theme-light .field-block {
      background: #f1f5f9;
      border-color: #e2e8f0;
    }
    .field-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .field-label {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field-count {
      font-size: 9px;
      font-family: ui-monospace, monospace;
      color: #94a3b8;
    }
    .field-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      color: #f8fafc;
      outline: none;
      font-family: inherit;
    }
    body.theme-light .field-input {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .field-textarea {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
      color: #f8fafc;
      outline: none;
      font-family: inherit;
      resize: vertical;
      min-height: 48px;
      line-height: 1.35;
    }
    body.theme-light .field-textarea {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .field-copy-btn {
      width: 100%;
      background: #334155;
      border: none;
      color: #f8fafc;
      font-size: 10px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease-in-out;
    }
    body.theme-light .field-copy-btn {
      background: #e2e8f0;
      color: #0f172a;
    }
    .field-copy-btn:hover {
      background: #475569;
    }
    body.theme-light .field-copy-btn:hover {
      background: #cbd5e1;
    }
    .field-copy-btn.copied {
      background: #10b981 !important;
      color: #ffffff !important;
    }
    .btn-copy-all {
      width: 100%;
      background: #e60023;
      border: none;
      color: #ffffff;
      font-weight: 800;
      font-size: 12px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(230, 0, 35, 0.3);
      transition: all 0.15s ease-in-out;
    }
    .btn-copy-all:hover {
      background: #ad001a;
    }
    .btn-copy-all.copied {
      background: #10b981 !important;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
    .btn-secondary {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      font-weight: 600;
      font-size: 11px;
      padding: 7px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    body.theme-light .btn-secondary {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    body.theme-light .btn-secondary:hover {
      background: #f1f5f9;
    }
    .toast {
      position: fixed;
      bottom: 12px;
      left: 14px;
      right: 14px;
      background: #10b981;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      text-align: center;
      padding: 7px;
      border-radius: 6px;
      display: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      z-index: 99;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" class="logo-badge" alt="Pinterest Assistant" style="width:22px;height:22px;object-fit:contain;border-radius:6px;" />
      <span>Pinterest Assistant</span>
    </div>
    <button class="theme-toggle-btn" id="theme-btn" title="Toggle Theme">🌙</button>
  </div>

  <div id="queue-container" class="queue-header" style="display:none;">
    <button class="queue-btn" id="q-prev-btn">◀ Prev</button>
    <span id="q-status-text">Pin 1 of 5</span>
    <button class="queue-btn" id="q-next-btn">Next ▶</button>
  </div>

  <div id="pin-display">
    <div class="pin-card">
      <div class="pin-card-header">
        <span class="pin-id-badge" id="card-pin-id">Pin #1</span>
        <span style="font-size: 10px; color: #10b981; font-weight: bold;">Clipboard Ready ✓</span>
      </div>

      <!-- TITLE -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">TITLE</span>
          <span class="field-count" id="count-title">0 / 100</span>
        </div>
        <input type="text" class="field-input" id="input-title" placeholder="Generated Pinterest title" maxlength="100" />
        <button class="field-copy-btn" id="btn-copy-title">
          <span>📋 Copy Title</span>
        </button>
      </div>

      <!-- DESCRIPTION -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">DESCRIPTION</span>
          <span class="field-count" id="count-desc">0 / 500</span>
        </div>
        <textarea class="field-textarea" id="input-desc" placeholder="Generated Pinterest description" maxlength="500" rows="3"></textarea>
        <button class="field-copy-btn" id="btn-copy-desc">
          <span>📋 Copy Description</span>
        </button>
      </div>

      <!-- DESTINATION URL -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">DESTINATION URL</span>
        </div>
        <input type="url" class="field-input" id="input-url" placeholder="https://example.com/..." />
        <button class="field-copy-btn" id="btn-copy-url">
          <span>📋 Copy Destination URL</span>
        </button>
      </div>

      <!-- ALT SEO TEXT -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">ALT SEO TEXT</span>
          <span class="field-count" id="count-alt">0 / 500</span>
        </div>
        <textarea class="field-textarea" id="input-alt" placeholder="SEO description of the image" maxlength="500" rows="2"></textarea>
        <button class="field-copy-btn" id="btn-copy-alt">
          <span>📋 Copy Alt Text</span>
        </button>
      </div>

      <!-- TAGS -->
      <div class="field-block">
        <div class="field-header">
          <span class="field-label">TAGS</span>
          <span class="field-count" id="count-tags">0 tags</span>
        </div>
        <textarea class="field-textarea" id="input-tags" placeholder="matcha, matcha latte, healthy drinks..." rows="2"></textarea>
        <button class="field-copy-btn" id="btn-copy-tags">
          <span>📋 Copy Tags</span>
        </button>
      </div>
    </div>

    <!-- PROMINENT COPY ALL BUTTON -->
    <button class="btn-copy-all" id="btn-copy-all">
      <span>⚡ COPY ALL</span>
    </button>
  </div>

  <button class="btn-secondary" id="btn-import-clipboard">📋 Import from Clipboard</button>
  <button class="btn-secondary" id="btn-open-pinterest">📌 Open Pinterest Pin Builder</button>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
